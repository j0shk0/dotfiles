# i3status configuration file.
#
# ACHTUNG: I found this file in /etc/
#
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 1
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "cpu_usage"
order += "load"
order += "cpu_temperature 0"
order += "disk /"
order += "memory"
order += "tztime local"

wireless _first_ {
        format_up = "W: %essid with%quality quality at %frequency"
        format_down = "W: down"
}

ethernet _first_ {
        format_up = "E: (%speed)"
        format_down = "E: down"
}

battery all {
        format = "%status %percentage %remaining"
}

disk "/" {
        format = "D: %used (used) %avail (free)"
}

load {
        format = "L: %1min %5min %15min"
        max_threshold = 16
}

memory {
        format = "M: %used (used) %available (free)"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}

cpu_temperature 0 {
                   format = "T: %degrees °C"
                   path = "/sys/class/thermal/thermal_zone0/temp"
}


cpu_usage {
        format = "C: %usage"
}
